<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
        }
    </script>
    <style>
        .lesson-card { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
        a.lesson-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(15, 23, 42, .25); }
        a.lesson-card:active { transform: scale(.98); }
        .tag-filter.active { background: #1e293b; color: #fff; border-color: #1e293b; }
        @media (prefers-color-scheme: dark) {
            .tag-filter.active { background: #e2e8f0; color: #0f172a; border-color: #e2e8f0; }
        }
    </style>
</head>
<body class="min-h-screen font-sans bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

    <div class="max-w-6xl mx-auto px-4 md:px-8 py-10 md:py-14">

        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 mb-4">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">English Lessons</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Interactive whiteboard lessons. Choose a lesson to begin.</p>
        </header>

        <div id="filters" class="flex flex-wrap justify-center gap-2 mb-8"></div>
        <div id="status" class="text-center text-slate-500 dark:text-slate-400 py-10"></div>
        <div id="lessonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-12">Tip: inside a lesson, use the <i class="fa-solid fa-house"></i> Menu button (top left) to return here.</p>
    </div>

    <script>
    /* The list of lessons is NOT edited here.
       It is built automatically from the files in the "lessons" folder
       (see scripts/build_menu.py) and saved in lessons.json.

       Each lesson picks the look of its card with <meta name="lesson:theme">:
       twilight, ocean, forest, sunset, paper  (no theme = neutral card).
       Own colours (optional): lesson:bg, lesson:accent, lesson:text, e.g. #0f172a */

    /* Ready-made card themes */
    const THEMES = {
        twilight: { bg: 'linear-gradient(135deg,#111420 0%,#1b2033 60%,#2b1424 100%)', text: '#f1f5f9', accent: '#d4af37', border: 'rgba(212,175,55,.45)', font: "'Cinzel', serif" },
        ocean:    { bg: 'linear-gradient(135deg,#0c4a6e 0%,#075985 55%,#0e7490 100%)', text: '#f0f9ff', accent: '#7dd3fc', border: 'rgba(125,211,252,.4)', font: 'inherit' },
        forest:   { bg: 'linear-gradient(135deg,#14532d 0%,#166534 55%,#3f6212 100%)', text: '#f0fdf4', accent: '#bef264', border: 'rgba(190,242,100,.4)', font: 'inherit' },
        sunset:   { bg: 'linear-gradient(135deg,#7c2d12 0%,#be123c 65%,#9d174d 100%)', text: '#fff7ed', accent: '#fdba74', border: 'rgba(253,186,116,.4)', font: 'inherit' },
        paper:    { bg: '#fffbeb', text: '#422006', accent: '#b45309', border: '#fde68a', font: 'inherit' },
        custom:   { bg: '#1e293b', text: '#f8fafc', accent: '#38bdf8', border: null, font: 'inherit' }
    };
    const HEX = /^#[0-9a-fA-F]{3,8}$/;

    /* Colours for neutral (theme-less) cards */
    const PALETTE = {
        blue:   { icon: 'bg-blue-100 text-blue-600 dark:bg-blue-500/20 dark:text-blue-300',       accent: 'text-blue-600 dark:text-blue-300' },
        green:  { icon: 'bg-green-100 text-green-600 dark:bg-green-500/20 dark:text-green-300',    accent: 'text-green-600 dark:text-green-300' },
        teal:   { icon: 'bg-teal-100 text-teal-600 dark:bg-teal-500/20 dark:text-teal-300',        accent: 'text-teal-600 dark:text-teal-300' },
        amber:  { icon: 'bg-amber-100 text-amber-600 dark:bg-amber-500/20 dark:text-amber-300',    accent: 'text-amber-600 dark:text-amber-300' },
        orange: { icon: 'bg-orange-100 text-orange-600 dark:bg-orange-500/20 dark:text-orange-300', accent: 'text-orange-600 dark:text-orange-300' },
        red:    { icon: 'bg-rose-100 text-rose-600 dark:bg-rose-500/20 dark:text-rose-300',        accent: 'text-rose-600 dark:text-rose-300' },
        violet: { icon: 'bg-violet-100 text-violet-600 dark:bg-violet-500/20 dark:text-violet-300', accent: 'text-violet-600 dark:text-violet-300' },
        slate:  { icon: 'bg-slate-200 text-slate-600 dark:bg-slate-600/40 dark:text-slate-300',    accent: 'text-slate-600 dark:text-slate-300' }
    };
    PALETTE.gold = PALETTE.amber;
    PALETTE.rose = PALETTE.red;

    let LESSONS = [];
    let activeLevel = 'All';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* Returns the resolved theme object, or null for a neutral card */
    function resolveTheme(l) {
        const preset = THEMES[String(l.theme || '').toLowerCase()];
        const hasCustom = HEX.test(l.bg || '') || HEX.test(l.accent || '') || HEX.test(l.text || '');
        if (!preset && !hasCustom) return null;
        const t = Object.assign({}, preset || THEMES.custom);
        if (HEX.test(l.bg || '')) t.bg = l.bg;
        if (HEX.test(l.accent || '')) t.accent = l.accent;
        if (HEX.test(l.text || '')) t.text = l.text;
        if (!t.border || (preset && (HEX.test(l.accent || '')))) t.border = 'color-mix(in srgb, ' + t.accent + ' 45%, transparent)';
        return t;
    }

    /* Level and time chips (shown on every card) */
    function chipsHtml(l, t) {
        const chips = [];
        if (l.level) chips.push(['fa-signal', l.level]);
        if (l.minutes) chips.push(['fa-clock', l.minutes + ' min']);
        if (!chips.length) return '';
        return '<div class="flex flex-wrap gap-2 mb-3">' + chips.map(([ic, txt]) => {
            if (t) {
                return `<span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full"
                    style="color:${t.accent};border:1px solid color-mix(in srgb, ${t.accent} 50%, transparent);background:color-mix(in srgb, ${t.accent} 14%, transparent)">
                    <i class="fa-solid ${ic}"></i>${esc(txt)}</span>`;
            }
            return `<span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">
                <i class="fa-solid ${ic}"></i>${esc(txt)}</span>`;
        }).join('') + '</div>';
    }

    function renderFilters() {
        const levels = ['All', ...new Set(LESSONS.filter(l => l.level).map(l => l.level))];
        const box = document.getElementById('filters');
        box.innerHTML = '';
        if (levels.length <= 2) return; // filter is pointless with a single level
        levels.forEach(lv => {
            const b = document.createElement('button');
            b.className = 'tag-filter px-4 py-1.5 rounded-full border border-slate-300 dark:border-slate-600 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:border-slate-500 transition' + (lv === activeLevel ? ' active' : '');
            b.textContent = lv;
            b.onclick = () => { activeLevel = lv; renderFilters(); renderCards(); };
            box.appendChild(b);
        });
    }

    function renderCards() {
        const grid = document.getElementById('lessonGrid');
        grid.innerHTML = '';
        LESSONS.filter(l => activeLevel === 'All' || l.level === activeLevel).forEach(l => {
            const icon = /^fa-[a-z0-9-]+$/.test(l.icon || '') ? l.icon : 'fa-book';
            const t = resolveTheme(l);
            const el = document.createElement('a');
            el.href = l.href;

            if (t) {
                /* Themed card */
                el.className = 'lesson-card relative overflow-hidden flex flex-col p-6 rounded-2xl shadow-md';
                el.setAttribute('style', `background:${t.bg};color:${t.text};border:1px solid ${t.border}`);
                el.innerHTML = `
                    <div style="position:absolute;right:-10px;bottom:-22px;font-size:9rem;line-height:1;color:${t.accent};opacity:.09;pointer-events:none"><i class="fa-solid ${icon}"></i></div>
                    <div class="relative flex flex-col flex-1">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4"
                             style="color:${t.accent};background:color-mix(in srgb, ${t.accent} 18%, transparent);border:1px solid color-mix(in srgb, ${t.accent} 35%, transparent)">
                            <i class="fa-solid ${icon} text-xl"></i>
                        </div>
                        <h2 class="text-xl font-bold mb-1" style="font-family:${t.font}">${esc(l.title)}</h2>
                        ${l.grammar ? `<p class="text-xs font-semibold uppercase tracking-wide mb-3" style="color:${t.accent}">${esc(l.grammar)}</p>` : '<div class="mb-2"></div>'}
                        ${chipsHtml(l, t)}
                        <p class="text-sm flex-1" style="opacity:.8">${esc(l.desc)}</p>
                        <div class="flex items-center justify-end mt-5 pt-4 text-sm" style="border-top:1px solid color-mix(in srgb, ${t.accent} 25%, transparent)">
                            <span class="font-bold" style="color:${t.accent}">Start <i class="fa-solid fa-arrow-right ml-1"></i></span>
                        </div>
                    </div>`;
            } else {
                /* Neutral card */
                const c = PALETTE[l.color] || PALETTE.blue;
                el.className = 'lesson-card flex flex-col p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm';
                el.innerHTML = `
                    <div class="w-12 h-12 rounded-xl ${c.icon} flex items-center justify-center mb-4">
                        <i class="fa-solid ${icon} text-xl"></i>
                    </div>
                    <h2 class="text-xl font-bold mb-1">${esc(l.title)}</h2>
                    ${l.grammar ? `<p class="text-xs font-semibold uppercase tracking-wide ${c.accent} mb-3">${esc(l.grammar)}</p>` : '<div class="mb-2"></div>'}
                    ${chipsHtml(l, null)}
                    <p class="text-sm text-slate-600 dark:text-slate-300 flex-1">${esc(l.desc)}</p>
                    <div class="flex items-center justify-end mt-5 pt-4 border-t border-slate-100 dark:border-slate-700 text-sm">
                        <span class="font-bold ${c.accent}">Start <i class="fa-solid fa-arrow-right ml-1"></i></span>
                    </div>`;
            }
            grid.appendChild(el);
        });
    }

    async function loadLessons() {
        const status = document.getElementById('status');
        status.textContent = 'Loading lessons...';
        try {
            const res = await fetch('lessons.json?t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            LESSONS = await res.json();
        } catch (e) {
            status.innerHTML = 'Could not load the lesson list.<br><span class="text-xs text-slate-400">If you opened this file from your computer, publish the site on GitHub Pages: the list is built there automatically.</span>';
            return;
        }
        if (!LESSONS.length) {
            status.textContent = 'No lessons yet. Upload lesson files into the "lessons" folder.';
            return;
        }
        status.textContent = '';
        renderFilters();
        renderCards();
    }

    loadLessons();
    </script>
</body>
</html>
