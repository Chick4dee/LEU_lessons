<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Lessons - Interactive Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { vampire: { 900: '#090a0f', 800: '#111420', 700: '#1b2033', crimson: '#880808', gold: '#d4af37', goldGlow: '#f5d061', teal: '#14b8a6' } },
                fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
            } }
        }
    </script>
    <style>
        body { background: #090a0f; color: #f1f5f9; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .glass-panel {
            background: rgba(17, 20, 32, 0.78);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
        }
        .glow-text-gold { text-shadow: 0 0 10px rgba(212,175,55,.6), 0 0 20px rgba(212,175,55,.3); }
        #fogCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35; }
        .lesson-card { transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
        a.lesson-card:hover { transform: translateY(-4px); border-color: rgba(212,175,55,.7); box-shadow: 0 12px 36px rgba(212,175,55,.15); }
        a.lesson-card:active { transform: scale(.98); }
        .lesson-card.soon { opacity: .55; border-style: dashed; cursor: default; }
        .tag-filter.active { background: rgba(212,175,55,.25); color: #f5d061; border-color: rgba(212,175,55,.6); }
    </style>
</head>
<body class="min-h-screen font-sans relative">
    <canvas id="fogCanvas"></canvas>

    <div class="relative z-10 max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-12">

        <header class="text-center mb-10">
            <i class="fa-solid fa-moon text-vampire-gold text-4xl mb-3 animate-pulse"></i>
            <h1 class="font-cinzel text-3xl md:text-5xl font-black text-vampire-gold glow-text-gold tracking-wide">ENGLISH LESSONS</h1>
            <p class="text-slate-400 mt-3">Interactive whiteboard lessons. Choose a lesson to begin.</p>
        </header>

        <!-- Filters -->
        <div id="filters" class="flex flex-wrap justify-center gap-2 mb-8"></div>

        <!-- Lesson cards -->
        <div id="lessonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <p class="text-center text-xs text-slate-500 mt-12">Tip: inside a lesson, use the <i class="fa-solid fa-house"></i> Menu button (top left) to return here.</p>
    </div>

    <script>
    /* ============================================================
       LESSON LIST — to add a new lesson:
       1. put its HTML file into the "lessons" folder
       2. copy one block below, change the fields, done.
       Set soon: true to show a greyed-out "coming soon" card.
       ============================================================ */
    const LESSONS = [
        {
            title: 'Adapting to the Supernatural',
            grammar: 'used to / be used to / get used to',
            desc: "Past habits, familiarity and adaptation, told through Bella Swan's immortal journey.",
            level: 'B1-B2',
            minutes: 45,
            icon: 'fa-moon',
            color: 'gold',
            href: 'lessons/used-to.html'
        },
        {
            title: 'Next lesson',
            grammar: 'coming soon',
            desc: 'A new thematic lesson will appear here.',
            level: '',
            minutes: 0,
            icon: 'fa-hourglass-half',
            color: 'slate',
            href: '#',
            soon: true
        }
    ];

    const COLORS = {
        gold:  { text: 'text-vampire-gold', bg: 'bg-vampire-gold/15', border: 'border-vampire-gold/30' },
        teal:  { text: 'text-vampire-teal', bg: 'bg-vampire-teal/15', border: 'border-vampire-teal/30' },
        red:   { text: 'text-red-400',      bg: 'bg-red-500/15',      border: 'border-red-500/30' },
        slate: { text: 'text-slate-400',    bg: 'bg-slate-500/15',    border: 'border-slate-500/30' }
    };

    let activeLevel = 'All';

    function renderFilters() {
        const levels = ['All', ...new Set(LESSONS.filter(l => l.level).map(l => l.level))];
        const box = document.getElementById('filters');
        box.innerHTML = '';
        if (levels.length <= 2) return; // no point filtering with a single level
        levels.forEach(lv => {
            const b = document.createElement('button');
            b.className = 'tag-filter px-4 py-1.5 rounded-full border border-slate-700 text-sm font-bold text-slate-300 hover:border-vampire-gold/50 transition' + (lv === activeLevel ? ' active' : '');
            b.textContent = lv;
            b.onclick = () => { activeLevel = lv; renderFilters(); renderCards(); };
            box.appendChild(b);
        });
    }

    function renderCards() {
        const grid = document.getElementById('lessonGrid');
        grid.innerHTML = '';
        LESSONS.filter(l => activeLevel === 'All' || l.soon || l.level === activeLevel).forEach(l => {
            const c = COLORS[l.color] || COLORS.gold;
            const el = document.createElement(l.soon ? 'div' : 'a');
            if (!l.soon) el.href = l.href;
            el.className = 'lesson-card glass-panel rounded-3xl p-6 flex flex-col ' + (l.soon ? 'soon' : '');
            el.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-2xl ${c.bg} border ${c.border} flex items-center justify-center">
                        <i class="fa-solid ${l.icon} ${c.text} text-xl"></i>
                    </div>
                    ${l.level ? `<span class="text-xs font-bold px-3 py-1 rounded-full bg-vampire-crimson/40 text-red-200 border border-red-500/30">${l.level}</span>` : ''}
                </div>
                <h2 class="font-cinzel text-xl font-bold ${c.text} mb-1">${l.title}</h2>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">${l.grammar}</p>
                <p class="text-sm text-slate-300 flex-1">${l.desc}</p>
                ${l.soon ? '' : `
                <div class="flex items-center justify-between mt-5 pt-4 border-t border-slate-700/60 text-sm">
                    <span class="text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${l.minutes} min</span>
                    <span class="font-bold ${c.text}">Start <i class="fa-solid fa-arrow-right ml-1"></i></span>
                </div>`}`;
            grid.appendChild(el);
        });
    }

    /* Fog background */
    (function fog() {
        const fc = document.getElementById('fogCanvas'), fctx = fc.getContext('2d');
        function size() { fc.width = innerWidth; fc.height = innerHeight; }
        size(); addEventListener('resize', size);
        const ps = [];
        for (let i = 0; i < 18; i++) ps.push({ x: Math.random() * fc.width, y: Math.random() * fc.height, r: Math.random() * 120 + 80, dx: (Math.random() - .5) * .4, dy: (Math.random() - .5) * .4 });
        (function loop() {
            fctx.clearRect(0, 0, fc.width, fc.height);
            ps.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if (p.x < -100) p.x = fc.width + 100; if (p.x > fc.width + 100) p.x = -100;
                if (p.y < -100) p.y = fc.height + 100; if (p.y > fc.height + 100) p.y = -100;
                const g = fctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.r);
                g.addColorStop(0, 'rgba(20,184,166,.15)'); g.addColorStop(1, 'rgba(9,10,15,0)');
                fctx.fillStyle = g; fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); fctx.fill();
            });
            requestAnimationFrame(loop);
        })();
    })();

    renderFilters();
    renderCards();
    </script>
</body>
</html>
